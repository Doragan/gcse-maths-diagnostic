name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # ── Blocking gate: these are green and env-independent ──────────────────
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Dummy values so the build's page-data collection can construct the
          # Supabase client without real secrets. No network happens at build.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://example.test

      # ── Non-blocking until the lint backlog is triaged (audit ④-lint) ───────
      # ~146 errors, mostly no-explicit-any and largely in scripts/. Reported
      # for visibility; flip `continue-on-error` to false once triaged to make
      # lint a hard gate too.
      - name: Lint (report only)
        run: npm run lint
        continue-on-error: true
