name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # ── Blocking gate: these are green and env-independent ──────────────────
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Dummy values so the build's page-data collection can construct the
          # Supabase client without real secrets. No network happens at build.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://example.test

      # ── Blocking: lint triaged to 0 errors (audit ④-lint). Pragmatic rules
      # (no-explicit-any, no-unused-vars, the React-Compiler hooks family) are
      # WARNINGS — visible, non-failing — for incremental cleanup; genuine
      # errors (rules-of-hooks, no-html-link-for-pages, parse errors) block.
      - name: Lint
        run: npm run lint
